name: Apply tested semantic CI fixes

on:
  push:
    branches:
      - agent/real-semantic-language
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: semantic-ci-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-semantic-language
          fetch-depth: 0
      - name: Apply checksum-verified semantic fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .github/semantic-ci-fix.part00
          test -f .github/semantic-ci-fix.part01
          cat .github/semantic-ci-fix.part00 .github/semantic-ci-fix.part01 > /tmp/semantic-ci-fix.b64
          base64 --decode /tmp/semantic-ci-fix.b64 > /tmp/semantic-ci-fix.patch.gz
          gzip -dc /tmp/semantic-ci-fix.patch.gz > /tmp/semantic-ci-fix.patch
          actual_sha="$(sha256sum /tmp/semantic-ci-fix.patch | cut -d' ' -f1)"
          expected_sha="4d937a091ecbeed39550939dac2e9460edc802e9458dba12d4df0a998eed6d07"
          test "$actual_sha" = "$expected_sha" || {
            echo "Patch checksum mismatch: $actual_sha"
            exit 1
          }
          git apply --check /tmp/semantic-ci-fix.patch
          git apply --index /tmp/semantic-ci-fix.patch
          git rm .github/semantic-ci-fix.part00 .github/semantic-ci-fix.part01
          git rm .github/workflows/apply-semantic-ci-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix semantic grammar and replace obsolete compiler CI"
          git push origin HEAD:agent/real-semantic-language
