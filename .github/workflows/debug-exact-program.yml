name: Debug exact FigureLoom Bio program

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_program:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run exact program
        id: exact
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/validate-bio-runtime-race.mjs exact-program > exact-program.log 2>&1
          status=$?
          cat exact-program.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload exact program output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-program-output-${{ github.run_id }}
          path: exact-program.log

      - name: Fail when exact program failed
        if: steps.exact.outputs.status != '0'
        run: exit 1
