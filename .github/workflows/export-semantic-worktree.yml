name: Apply and export semantic runtime

on:
  push:
    branches:
      - agent/real-semantic-language

permissions:
  contents: write

concurrency:
  group: semantic-runtime-checkpoint
  cancel-in-progress: false

jobs:
  apply-or-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-semantic-language
          fetch-depth: 0
      - name: Apply verified runtime checkpoint
        id: apply
        shell: bash
        run: |
          set -Eeuo pipefail
          diagnose() {
            status=$?
            set +e
            git reset --mixed HEAD >/dev/null 2>&1
            {
              echo "status=$status"
              echo "head=$(git rev-parse HEAD)"
              echo "checkpoint_present=$(test -f .github/runtime-checkpoint.b64 && echo yes || echo no)"
              echo "checkpoint_bytes=$(test -f .github/runtime-checkpoint.b64 && wc -c < .github/runtime-checkpoint.b64 || echo 0)"
              echo "patch_sha256=$(test -f /tmp/runtime.patch && sha256sum /tmp/runtime.patch | cut -d' ' -f1 || echo unavailable)"
              echo "--- apply check ---"
              test -f /tmp/apply-check.err && cat /tmp/apply-check.err
            } > .github/runtime-apply-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/runtime-apply-error.txt
            git commit -m "Record semantic runtime apply failure"
            git push origin HEAD:agent/real-semantic-language
            exit "$status"
          }
          trap diagnose ERR
          if [ ! -f .github/runtime-checkpoint.b64 ]; then
            rm -f .github/runtime-apply-error.txt
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base64 --decode .github/runtime-checkpoint.b64 > /tmp/runtime.patch.gz
          gzip -dc /tmp/runtime.patch.gz > /tmp/runtime.patch
          actual_sha="$(sha256sum /tmp/runtime.patch | cut -d' ' -f1)"
          expected_sha="5215cae1f1c33577b698db2149bc59cdf50a64e712556aa12cba5609f0da0260"
          test "$actual_sha" = "$expected_sha"
          git apply --check /tmp/runtime.patch 2>/tmp/apply-check.err
          git apply --index /tmp/runtime.patch
          git rm -f .github/runtime-checkpoint.b64
          git rm -f --ignore-unmatch .github/semantic-checkpoint.part*
          git rm -f --ignore-unmatch .github/runtime-apply-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Wire structured semantic runtime into the IDE"
          git push origin HEAD:agent/real-semantic-language
          trap - ERR
          echo "applied=true" >> "$GITHUB_OUTPUT"
      - name: Remove checkout metadata
        if: steps.apply.outputs.applied == 'false'
        run: rm -rf .git
      - name: Upload exact branch worktree
        if: steps.apply.outputs.applied == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: semantic-worktree
          path: .
          include-hidden-files: true
          retention-days: 1
