name: Apply verified semantic language

on:
  push:
    branches:
      - agent/verified-semantic-language
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/verified-semantic-language
          fetch-depth: 0
      - name: Apply the ordered verified patch
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            .github/verified-semantic.part00
            .github/verified-semantic.part01
            .github/verified-semantic.part02
            .github/verified-semantic.part03
            .github/verified-semantic.part04
            .github/verified-semantic.part05
            .github/verified-semantic.part06
            .github/verified-semantic.part07
          )
          for part in "${parts[@]}"; do
            test -f "$part" || { echo "Missing verified patch chunk: $part"; exit 1; }
          done
          cat "${parts[@]}" > /tmp/verified-semantic.patch.b64
          base64 --decode /tmp/verified-semantic.patch.b64 > /tmp/verified-semantic.patch.gz
          gzip -dc /tmp/verified-semantic.patch.gz > /tmp/verified-semantic.patch
          actual=$(sha256sum /tmp/verified-semantic.patch | cut -d' ' -f1)
          expected=bf76a28fb2a0650a0b642d988196280e09945e566c4d328598613aea7e91b0c3
          test "$actual" = "$expected" || { echo "Patch checksum mismatch: $actual"; exit 1; }
          git apply --check /tmp/verified-semantic.patch
          git apply --index /tmp/verified-semantic.patch
          git rm "${parts[@]}" .github/workflows/export-semantic-worktree.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Install verified structured semantic language"
          git push origin HEAD:agent/verified-semantic-language
