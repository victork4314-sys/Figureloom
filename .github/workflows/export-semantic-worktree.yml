name: Apply and export semantic runtime

on:
  push:
    branches:
      - agent/real-semantic-language

permissions:
  contents: write

concurrency:
  group: semantic-runtime-checkpoint
  cancel-in-progress: false

jobs:
  apply-or-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-semantic-language
          fetch-depth: 0
      - name: Apply verified runtime checkpoint
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/runtime-checkpoint.b64 ]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base64 --decode .github/runtime-checkpoint.b64 > /tmp/runtime.patch.gz
          gzip -dc /tmp/runtime.patch.gz > /tmp/runtime.patch
          actual_sha="$(sha256sum /tmp/runtime.patch | cut -d' ' -f1)"
          expected_sha="5215cae1f1c33577b698db2149bc59cdf50a64e712556aa12cba5609f0da0260"
          test "$actual_sha" = "$expected_sha" || {
            echo "Runtime patch checksum mismatch: $actual_sha"
            exit 1
          }
          git apply --check /tmp/runtime.patch
          git apply --index /tmp/runtime.patch
          git rm -f .github/runtime-checkpoint.b64
          git rm -f --ignore-unmatch .github/semantic-checkpoint.part*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Wire structured semantic runtime into the IDE"
          git push origin HEAD:agent/real-semantic-language
          echo "applied=true" >> "$GITHUB_OUTPUT"
      - name: Remove checkout metadata
        if: steps.apply.outputs.applied == 'false'
        run: rm -rf .git
      - name: Upload exact branch worktree
        if: steps.apply.outputs.applied == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: semantic-worktree
          path: .
          include-hidden-files: true
          retention-days: 1
