name: Apply semantic checkpoint

on:
  push:
    branches:
      - agent/real-semantic-language

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-semantic-language
          fetch-depth: 0
      - name: Apply the complete ordered checkpoint
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            .github/semantic-checkpoint.part00
            .github/semantic-checkpoint.part01
            .github/semantic-checkpoint.part02
            .github/semantic-checkpoint.part03
            .github/semantic-checkpoint.part04
          )
          for part in "${parts[@]}"; do
            test -f "$part" || { echo "Missing required checkpoint fragment: $part"; exit 1; }
          done
          cat "${parts[@]}" > /tmp/semantic-checkpoint.b64
          base64 --decode /tmp/semantic-checkpoint.b64 > /tmp/semantic-checkpoint.patch.gz
          gzip -dc /tmp/semantic-checkpoint.patch.gz > /tmp/semantic-checkpoint.patch
          echo "Encoded bytes: $(wc -c < /tmp/semantic-checkpoint.b64)"
          echo "Patch bytes: $(wc -c < /tmp/semantic-checkpoint.patch)"
          echo "Patch SHA-256: $(sha256sum /tmp/semantic-checkpoint.patch | cut -d' ' -f1)"
          git apply --check /tmp/semantic-checkpoint.patch
          git apply --index /tmp/semantic-checkpoint.patch
          git rm -f --ignore-unmatch .github/semantic-checkpoint.part* .github/semantic-apply-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add structured semantic language checkpoint"
          git push origin HEAD:agent/real-semantic-language
