name: FigureLoom Bio semantic language contract

on:
  pull_request:
    paths:
      - "figureloom-bio/**"
      - "ide/ide-semantic-language.js"
      - "ide/ide-semantic-runtime.js"
      - "ide/ide-semantic-run-authority.js"
      - "ide/ide-language-highlighter.js"
      - "ide/ide-app-v2.js"
      - "scripts/validate-bio-semantic-runtime.mjs"
      - ".github/workflows/figureloom-bio-language.yml"
  push:
    paths:
      - "figureloom-bio/**"
      - "ide/ide-semantic-language.js"
      - "ide/ide-semantic-runtime.js"
      - "ide/ide-semantic-run-authority.js"
      - "ide/ide-language-highlighter.js"
      - "ide/ide-app-v2.js"
      - "scripts/validate-bio-semantic-runtime.mjs"
      - ".github/workflows/figureloom-bio-language.yml"

permissions:
  contents: read

jobs:
  language-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FigureLoom Bio
        run: python -m pip install -e ./figureloom-bio

      - name: Check semantic browser contract
        run: node scripts/validate-bio-semantic-runtime.mjs

      - name: Check browser and Python structures agree
        run: python -m unittest figureloom-bio/tests/test_semantic_language.py -v

      - name: Run every Python regression
        shell: bash
        run: |
          set -o pipefail
          cd figureloom-bio
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee ../figureloom-bio-language-tests.log

      - name: Upload complete language test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figureloom-bio-language-tests-${{ github.run_id }}
          path: figureloom-bio-language-tests.log
