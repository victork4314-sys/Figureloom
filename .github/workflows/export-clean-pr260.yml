name: Export clean PR 260

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-semantic-language
      - run: rm -rf .git
      - uses: actions/upload-artifact@v4
        with:
          name: clean-pr260-worktree
          path: .
          include-hidden-files: true
          retention-days: 1
