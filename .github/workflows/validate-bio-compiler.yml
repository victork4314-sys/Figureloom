name: Validate FigureLoom Bio semantic language

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-bio-semantic-language-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-language:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload exact PR worktree for verification
        uses: actions/upload-artifact@v6
        with:
          name: pr260-current-worktree-${{ github.run_id }}
          path: .
          include-hidden-files: true
          retention-days: 1

      - name: Check semantic browser source
        run: |
          node --check ide/ide-semantic-language.js
          node --check ide/ide-semantic-runtime.js
          node --check ide/ide-semantic-run-authority.js
          node --check ide/ide-language-highlighter.js
          node --check ide/ide-app-v2.js
          node --check scripts/validate-bio-semantic-runtime.mjs

      - name: Test tokenizer grammar AST and direct browser runtime
        run: node scripts/validate-bio-semantic-runtime.mjs

      - name: Check semantic Python source
        run: |
          python3 -m py_compile \
            figureloom-bio/figureloom_bio/semantic_language.py \
            figureloom-bio/figureloom_bio/parser.py \
            figureloom-bio/figureloom_bio/control_flow_logic.py

      - name: Test browser and Python semantic agreement
        env:
          PYTHONPATH: figureloom-bio
        run: python3 -m unittest figureloom-bio/tests/test_semantic_language.py -v

      - name: Test semantic control flow
        env:
          PYTHONPATH: figureloom-bio
        run: python3 -m unittest figureloom-bio/tests/test_control_flow_logic.py -v

      - name: Capture complete FigureLoom Bio regression suite
        id: full_tests
        shell: bash
        run: |
          set +e
          cd figureloom-bio
          python3 -m unittest discover -s tests -v > ../full-bio-test.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload complete regression log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-bio-test-log-${{ github.run_id }}
          path: full-bio-test.log
          if-no-files-found: error

      - name: Require complete regression suite
        if: steps.full_tests.outputs.status != '0'
        run: |
          tail -n 500 full-bio-test.log
          exit 1
