name: Validate FigureLoom Bio compiler

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: validate-bio-compiler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Check compiler JavaScript syntax
        run: |
          node --check ide/ide-language-compiler.js
          node --check ide/ide-logic-compiler.js
          node --check ide/ide-language-catalog-ui.js
          node --check ide/ide-vocabulary-ui-copy.js
          node --check scripts/validate-bio-language-compiler.mjs
          node --check scripts/validate-bio-logic-compiler.mjs

      - name: Execute browser compiler frontend tests
        run: |
          node scripts/validate-bio-language-compiler.mjs
          node scripts/validate-bio-logic-compiler.mjs

      - name: Check compiler Python syntax
        run: |
          python3 -m py_compile \
            figureloom-bio/figureloom_bio/language_compiler.py \
            figureloom-bio/figureloom_bio/language_compiler_runtime.py \
            figureloom-bio/figureloom_bio/control_flow_logic.py \
            figureloom-bio/figureloom_bio/parser.py \
            figureloom-bio/figureloom_bio/language_diagnostics.py \
            figureloom-bio/figureloom_bio/cli.py \
            scripts/generate-bio-command-reference.py

      - name: Regenerate complete language reference
        run: python3 scripts/generate-bio-command-reference.py

      - name: Commit regenerated language reference
        shell: bash
        run: |
          if git diff --quiet -- wiki/FigureLoom-Bio-Command-Reference.md; then
            echo "The checked-in language reference is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki/FigureLoom-Bio-Command-Reference.md
          git commit -m "Regenerate complete FigureLoom Bio language reference"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload generated language reference
        uses: actions/upload-artifact@v6
        with:
          name: complete-bio-language-reference-${{ github.run_id }}
          path: wiki/FigureLoom-Bio-Command-Reference.md
          if-no-files-found: error

      - name: Capture compiler regression tests
        id: compiler_tests
        shell: bash
        run: |
          set +e
          cd figureloom-bio
          python3 -m unittest tests.test_language_compiler tests.test_parser_explanations -v > ../compiler-test.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload compiler test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compiler-test-log
          path: compiler-test.log
          if-no-files-found: error

      - name: Require compiler regression tests
        if: steps.compiler_tests.outputs.status != '0'
        run: |
          cat compiler-test.log
          exit 1

      - name: Run control-flow tests alone
        run: |
          cd figureloom-bio
          python3 -m unittest tests.test_control_flow tests.test_control_flow_logic -v

      - name: Capture full FigureLoom Bio tests
        id: full_tests
        shell: bash
        run: |
          set +e
          cd figureloom-bio
          python3 -m unittest discover -s tests -v > ../full-bio-test.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare compact full-suite failure log
        if: steps.full_tests.outputs.status != '0'
        run: tail -n 500 full-bio-test.log > full-bio-test-failure.log

      - name: Upload compact full-suite failure log
        if: steps.full_tests.outputs.status != '0'
        uses: actions/upload-artifact@v6
        with:
          name: full-bio-test-failure-${{ github.run_id }}
          path: full-bio-test-failure.log
          if-no-files-found: error

      - name: Require full FigureLoom Bio tests
        if: steps.full_tests.outputs.status != '0'
        run: |
          cat full-bio-test-failure.log
          exit 1

      - name: Validate documentation
        run: node scripts/validate-bio-documentation.mjs
