name: Correct FigureLoom Bio codon mapping

on:
  push:
    branches: [agent/fix-all-live-language-fallbacks]

permissions:
  contents: write

jobs:
  correct_codon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/fix-all-live-language-fallbacks

      - name: Correct AAG and verify the change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ide/ide-core-language-runtime.js')
          source = path.read_text()
          wrong = "AAA:'K',AAG:'S',AGT:'S'"
          right = "AAA:'K',AAG:'K',AGT:'S'"
          if source.count(wrong) != 1:
              raise SystemExit('Expected exactly one incorrect AAG mapping.')
          path.write_text(source.replace(wrong, right))
          PY
          grep -F "AAA:'K',AAG:'K',AGT:'S'" ide/ide-core-language-runtime.js

      - name: Commit the correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ide/ide-core-language-runtime.js
          git commit -m "Correct AAG translation in the browser runtime"
          git push origin HEAD:agent/fix-all-live-language-fallbacks
