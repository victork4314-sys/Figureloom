name: Apply verified semantic stage two

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  stage-two:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/semantic-language-takeover
          fetch-depth: 0
      - name: Decode and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/semantic-stage-two.patch.gz.b64
          base64 --decode .github/semantic-stage-two.patch.gz.b64 | gzip -dc > /tmp/semantic-stage-two.patch
          echo "1d6e510691e62af914f69c0b15b9a64a2edeb415851f106cffef227db8480e24  /tmp/semantic-stage-two.patch" | sha256sum --check
          git apply --check /tmp/semantic-stage-two.patch
          git apply /tmp/semantic-stage-two.patch
      - name: Verify tokenizer AST runtime and parity
        shell: bash
        run: |
          set -euo pipefail
          node --check ide/ide-semantic-language.js
          node --check ide/ide-semantic-runtime.js
          node --check ide/ide-core-language-runtime.js
          node --check ide/ide-semantic-microbiology-runtime.js
          node --check ide/ide-analysis-language.js
          node --check ide/ide-complete-language.js
          node --check ide/ide-current-file-language.js
          node --check ide/ide-generated-current-file.js
          node --check ide/ide-app-v2.js
          node scripts/validate-bio-semantic-runtime.mjs
          node scripts/validate-bio-logic-compiler.mjs
          PYTHONPATH=figureloom-bio python -m unittest figureloom-bio/tests/test_semantic_language.py -v
          PYTHONPATH=figureloom-bio python -m unittest figureloom-bio/tests/test_language_compiler.py -v
      - name: Commit actual source only
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/semantic-stage-two.patch.gz.b64 .github/workflows/semantic-stage-two.yml
          git add \
            ide/ide-semantic-language.js \
            ide/ide-semantic-runtime.js \
            ide/ide-core-language-runtime.js \
            ide/ide-semantic-microbiology-runtime.js \
            ide/ide-analysis-language.js \
            ide/ide-complete-language.js \
            ide/ide-current-file-language.js \
            ide/ide-generated-current-file.js \
            ide/ide-app-v2.js \
            ide/ide-language-highlighter.js \
            ide/index.html \
            scripts/validate-bio-semantic-runtime.mjs \
            scripts/validate-bio-logic-compiler.mjs \
            figureloom-bio/figureloom_bio/parser.py \
            figureloom-bio/figureloom_bio/semantic_language.py \
            figureloom-bio/tests/test_semantic_language.py \
            figureloom-bio/tests/test_language_compiler.py \
            .github/workflows/validate-bio-compiler.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete structured execution routes for semantic language"
          git push origin HEAD:agent/semantic-language-takeover
