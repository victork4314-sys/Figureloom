name: Wire semantic table runtime

on:
  push:
    branches:
      - agent/max-real-semantic-language

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/max-real-semantic-language
          fetch-depth: 0
      - name: Route table AST actions through the shared dispatcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('ide/ide-app-v2.js')
          text = path.read_text(encoding='utf-8')
          old = '''const executor = semanticRuntime.createExecutor({
          executeInstruction: async (node, currentState) => {
          const runtimeInstruction = api.toRuntime(node);
          await runSingle([runtimeInstruction], runNumber, repeatCount, target, currentState);
          return currentState.data;
          }
          });'''
          new = '''const executor = semanticRuntime.createExecutor({
          executeInstruction: async (node, currentState) => {
          const tableRuntime = window.FigureLoomBioSemanticTableRuntime;
          if (tableRuntime?.supports(node.action)) {
          await tableRuntime.executeInstruction(node, currentState);
          return currentState.data;
          }
          const runtimeInstruction = api.toRuntime(node);
          await runSingle([runtimeInstruction], runNumber, repeatCount, target, currentState);
          return currentState.data;
          }
          });'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one semantic executor target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          node --check ide/ide-app-v2.js
          grep -F 'tableRuntime.executeInstruction(node, currentState)' ide/ide-app-v2.js
          git add ide/ide-app-v2.js
          git rm .github/workflows/wire-semantic-table-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Route table AST actions through semantic runtime"
          git push origin HEAD:agent/max-real-semantic-language
