name: Validate free-form stress-test start

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-bio-freeform-stress-start-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  freeform_stress_start:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check changed JavaScript
        run: |
          node --check ide/ide-semantic-language.js
          node --check ide/ide-semantic-runtime.js
          node --check ide/ide-semantic-run-authority.js
          node --check scripts/validate-bio-freeform-stress-start.mjs

      - name: Parse the exact five red instructions through the semantic grammar
        run: node scripts/validate-bio-freeform-stress-start.mjs
