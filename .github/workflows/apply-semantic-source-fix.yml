name: Apply semantic source fix

on:
  push:
    branches:
      - agent/real-semantic-language

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('.github/semantic-source-fix.patch') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-semantic-language
          fetch-depth: 0
      - name: Verify and apply reviewable source patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/semantic-source-fix.patch
          git apply .github/semantic-source-fix.patch
          node --check ide/ide-semantic-language.js
          PYTHONPATH=figureloom-bio python -m unittest figureloom-bio/tests/test_semantic_language.py -v
          git rm -f .github/semantic-source-fix.patch .github/workflows/apply-semantic-source-fix.yml
          git rm -f --ignore-unmatch .github/semantic-checkpoint.part* .github/semantic-apply-error.txt
          git add ide/ide-semantic-language.js figureloom-bio/tests/test_semantic_language.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix semantic word roles in browser parser"
          git push origin HEAD:agent/real-semantic-language
