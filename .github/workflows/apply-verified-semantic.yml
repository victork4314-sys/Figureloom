name: Apply verified semantic language

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/verified-semantic-language-direct'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/verified-semantic-language-direct
          fetch-depth: 0
      - name: Verify and apply semantic language patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/verified-semantic.patch.b64 > /tmp/verified-semantic.patch.gz
          gzip -dc /tmp/verified-semantic.patch.gz > /tmp/verified-semantic.patch
          actual=$(sha256sum /tmp/verified-semantic.patch | cut -d' ' -f1)
          expected=bf76a28fb2a0650a0b642d988196280e09945e566c4d328598613aea7e91b0c3
          test "$actual" = "$expected" || { echo "Patch checksum mismatch: $actual"; exit 1; }
          git apply --check /tmp/verified-semantic.patch
          git apply --index /tmp/verified-semantic.patch
          git rm .github/verified-semantic.patch.b64 .github/workflows/apply-verified-semantic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Install verified structured semantic language"
          git push origin HEAD:agent/verified-semantic-language-direct
