name: Apply isolated semantic core

on:
  push:
    branches:
      - agent/max-real-semantic-language
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: isolated-semantic-core
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/max-real-semantic-language
          fetch-depth: 0
      - name: Apply exact tested core patch
        shell: bash
        run: |
          set -Eeuo pipefail
          diagnose() {
            status=$?
            set +e
            git reset --mixed HEAD >/dev/null 2>&1
            {
              echo "status=$status"
              echo "head=$(git rev-parse HEAD)"
              for index in 00 01 02 03 04 05; do
                path=".github/takeover-core.part${index}"
                echo "part${index}_bytes=$(test -f "$path" && wc -c < "$path" || echo 0)"
              done
              echo "decoded_patch_sha=$(test -f /tmp/takeover-core.patch && sha256sum /tmp/takeover-core.patch | cut -d' ' -f1 || echo unavailable)"
              echo "--- decode ---"
              test -f /tmp/decode.err && cat /tmp/decode.err
              echo "--- gzip ---"
              test -f /tmp/gzip.err && cat /tmp/gzip.err
              echo "--- apply check ---"
              test -f /tmp/apply.err && cat /tmp/apply.err
            } > .github/takeover-core-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/takeover-core-error.txt
            git commit -m "Record isolated semantic core apply failure"
            git push origin HEAD:agent/max-real-semantic-language
            exit "$status"
          }
          trap diagnose ERR
          parts=()
          for index in 00 01 02 03 04 05; do
            path=".github/takeover-core.part${index}"
            test -f "$path"
            parts+=("$path")
          done
          cat "${parts[@]}" > /tmp/takeover-core.b64
          base64 --decode /tmp/takeover-core.b64 > /tmp/takeover-core.patch.gz 2>/tmp/decode.err
          gzip -dc /tmp/takeover-core.patch.gz > /tmp/takeover-core.patch 2>/tmp/gzip.err
          actual_sha="$(sha256sum /tmp/takeover-core.patch | cut -d' ' -f1)"
          expected_sha="b21c20781ecfe46f39041ce78ea4231ac4681e8872eb0dccbde803b48fa47a33"
          test "$actual_sha" = "$expected_sha"
          git apply --check /tmp/takeover-core.patch 2>/tmp/apply.err
          git apply --index /tmp/takeover-core.patch
          git rm .github/takeover-core.part00 .github/takeover-core.part01 .github/takeover-core.part02 .github/takeover-core.part03 .github/takeover-core.part04 .github/takeover-core.part05
          git rm .github/workflows/apply-takeover-core.yml
          git rm -f --ignore-unmatch .github/takeover-core-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply semantic grammar parity and control-flow fixes"
          git push origin HEAD:agent/max-real-semantic-language
          trap - ERR
