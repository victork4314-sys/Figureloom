name: Validate reported FigureLoom Bio gaps

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reported_gaps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check changed browser files
        run: |
          node --check ide/ide-control-flow-runtime.js
          node --check ide/ide-large-file-vault-v2.js
          node --check ide/ide-builtin-language-support.js
          node --check scripts/validate-bio-reported-gaps.mjs

      - name: Run the exact routing and warning regressions
        run: node scripts/validate-bio-reported-gaps.mjs
