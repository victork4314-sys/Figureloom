name: Apply semantic core fixes

on:
  push:
    branches:
      - agent/real-semantic-language
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: semantic-core-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-semantic-language
          fetch-depth: 0
      - name: Apply checksum-verified semantic core fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          diagnose() {
            status=$?
            set +e
            git reset --mixed HEAD >/dev/null 2>&1
            {
              echo "status=$status"
              echo "head=$(git rev-parse HEAD)"
              echo "part00_bytes=$(test -f .github/semantic-core-fix.part00 && wc -c < .github/semantic-core-fix.part00 || echo 0)"
              echo "part01_bytes=$(test -f .github/semantic-core-fix.part01 && wc -c < .github/semantic-core-fix.part01 || echo 0)"
              echo "decoded_patch_sha=$(test -f /tmp/semantic-core-fix.patch && sha256sum /tmp/semantic-core-fix.patch | cut -d' ' -f1 || echo unavailable)"
              echo "--- decode ---"
              test -f /tmp/decode.err && cat /tmp/decode.err
              echo "--- gzip ---"
              test -f /tmp/gzip.err && cat /tmp/gzip.err
              echo "--- apply check ---"
              test -f /tmp/apply.err && cat /tmp/apply.err
            } > .github/semantic-core-fix-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/semantic-core-fix-error.txt
            git commit -m "Record semantic core fix apply failure"
            git push origin HEAD:agent/real-semantic-language
            exit "$status"
          }
          trap diagnose ERR
          test -f .github/semantic-core-fix.part00
          test -f .github/semantic-core-fix.part01
          cat .github/semantic-core-fix.part00 .github/semantic-core-fix.part01 > /tmp/semantic-core-fix.b64
          base64 --decode /tmp/semantic-core-fix.b64 > /tmp/semantic-core-fix.patch.gz 2>/tmp/decode.err
          gzip -dc /tmp/semantic-core-fix.patch.gz > /tmp/semantic-core-fix.patch 2>/tmp/gzip.err
          actual_sha="$(sha256sum /tmp/semantic-core-fix.patch | cut -d' ' -f1)"
          expected_sha="b21c20781ecfe46f39041ce78ea4231ac4681e8872eb0dccbde803b48fa47a33"
          test "$actual_sha" = "$expected_sha"
          git apply --check /tmp/semantic-core-fix.patch 2>/tmp/apply.err
          git apply --index /tmp/semantic-core-fix.patch
          git rm .github/semantic-core-fix.part00 .github/semantic-core-fix.part01
          git rm .github/workflows/apply-semantic-core-fix.yml
          git rm -f --ignore-unmatch \
            .github/semantic-ci-fix.part00 \
            .github/semantic-ci-fix.part01 \
            .github/semantic-ci-fix-error.txt \
            .github/workflows/apply-semantic-ci-fix.yml \
            .github/semantic-core-fix-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply semantic grammar parity and control-flow fixes"
          git push origin HEAD:agent/real-semantic-language
          trap - ERR
