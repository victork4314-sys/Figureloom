name: Validate FigureLoom Bio semantic flow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-bio-semantic-flow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bio_flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check semantic browser JavaScript
        run: |
          node --check ide/ide-semantic-language.js
          node --check ide/ide-semantic-runtime.js
          node --check ide/ide-semantic-run-authority.js
          node --check ide/ide-language-highlighter.js
          node --check ide/ide-app-v2.js
          node --check scripts/validate-bio-semantic-runtime.mjs
          node --check scripts/validate-bio-all-in-one-table-section.mjs

      - name: Validate tokenizer grammar AST and direct dispatcher
        run: node scripts/validate-bio-semantic-runtime.mjs

      - name: Execute the semantic all-in-one table chain
        run: node scripts/validate-bio-all-in-one-table-section.mjs

      - name: Validate exact browser and scientific handlers
        shell: bash
        run: |
          set -euo pipefail
          run_checked() {
            file="$1"
            marker="$2"
            log="$(mktemp)"
            set +e
            timeout 45s node "$file" 2>&1 | tee "$log"
            status="${PIPESTATUS[0]}"
            set -e
            grep -F "$marker" "$log"
            if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
              echo "$file failed with status $status"
              exit "$status"
            fi
          }
          run_checked scripts/validate-bio-exact-all-in-one.mjs "The exact all-in-one stress test completed through the real browser runtime"
          run_checked scripts/validate-bio-core-translation.mjs "FigureLoom Bio translated AAG to lysine (K) through the real shared core handler."
          run_checked scripts/validate-bio-analysis-language.mjs "FigureLoom Bio native statistics and seven SVG figure sentences passed the real browser Run route."
          run_checked scripts/validate-bio-current-file-runtime.mjs "FigureLoom Bio current-file sentences passed the real browser Run route without changing the visible program."

      - name: Reject unfinished runtime placeholders
        run: node scripts/validate-bio-no-placeholders.mjs

      - name: Validate documentation
        run: node scripts/validate-bio-documentation.mjs

      - name: Run semantic Python tests
        env:
          PYTHONPATH: figureloom-bio
        run: |
          python3 -m unittest figureloom-bio/tests/test_semantic_language.py -v
          python3 -m unittest figureloom-bio/tests/test_control_flow_logic.py -v
          python3 -m unittest figureloom-bio/tests/test_sequence_management.py -v

      - name: Run complete FigureLoom Bio regressions
        run: |
          cd figureloom-bio
          python3 -m unittest discover -s tests -v
