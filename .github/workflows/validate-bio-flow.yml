name: Validate FigureLoom Bio flow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-bio-flow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bio_flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check semantic browser JavaScript syntax
        run: |
          node --check ide/ide-semantic-language.js
          node --check ide/ide-bio-expansion-language.js
          node --check ide/ide-semantic-runtime.js
          node --check ide/ide-bio-expansion-runtime.js
          node --check ide/ide-bio-expansion-runtime-2.js
          node --check ide/ide-scientific-informatics-runtime.js
          node --check ide/ide-core-language-runtime.js
          node --check ide/ide-semantic-microbiology-runtime.js
          node --check ide/ide-semantic-run-authority.js
          node --check ide/ide-current-file-language.js
          node --check ide/ide-generated-current-file.js
          node --check ide/ide-analysis-language.js
          node --check ide/ide-complete-language.js
          node --check ide/ide-language-highlighter.js
          node --check ide/ide-workspace-cleanup.js
          node --check ide/ide-topic-composition-tests.js
          node --check ide/ide-bio-expansion-composition.js
          node --check ide/ide-grammar-composition-tests.js
          node --check ide/ide-app-v2.js
          node --check scripts/validate-bio-semantic-runtime.mjs
          node --check scripts/validate-bio-expansion.mjs
          node --check scripts/validate-bio-expansion-2.mjs
          node --check scripts/validate-scientific-informatics-expansion.mjs
          node --check scripts/validate-bio-topic-composition-tests.mjs
          node --check scripts/validate-bio-expansion-control-flow.mjs
          node --check scripts/validate-bio-logic-compiler.mjs
          node --check scripts/validate-bio-semantic-browser.mjs
          node --check scripts/validate-bio-freeform-stress-start.mjs
          node --check scripts/validate-bio-all-in-one-table-section.mjs
          node --check scripts/validate-bio-240-compositional-tests.mjs
          node --check scripts/validate-bio-test-workspace-controls.mjs

      - name: Validate tokenizer grammar AST runtime and advertised actions
        run: node scripts/validate-bio-semantic-runtime.mjs

      - name: Validate simple bioinformatics expansion in browser and Python
        run: node scripts/validate-bio-expansion.mjs

      - name: Validate generated scientific bioinformatics expansion
        run: node scripts/validate-bio-expansion-2.mjs

      - name: Validate 54 broad scientific informatics actions
        run: node scripts/validate-scientific-informatics-expansion.mjs

      - name: Validate nine topic tests with 108 unique lines each
        run: node scripts/validate-bio-topic-composition-tests.mjs

      - name: Validate expanded bioinformatics actions inside control flow
        run: node scripts/validate-bio-expansion-control-flow.mjs

      - name: Validate every declared word and 356 differently ordered programs
        run: node scripts/validate-bio-240-compositional-tests.mjs

      - name: Validate test workspace replacement and clear controls
        run: node scripts/validate-bio-test-workspace-controls.mjs

      - name: Validate Boolean logic recipes loops and named results
        run: node scripts/validate-bio-logic-compiler.mjs

      - name: Validate independently written free-form programs without rewriting
        run: node scripts/validate-bio-freeform-stress-start.mjs

      - name: Validate the complete table mutation chain
        run: node scripts/validate-bio-all-in-one-table-section.mjs

      - name: Install real-browser test dependency
        run: npm install --no-audit --no-fund

      - name: Install Chromium for semantic Run tests
        run: npx playwright install --with-deps chromium

      - name: Run the production IDE Run button through the semantic path
        run: node scripts/validate-bio-semantic-browser.mjs

      - name: Run complete FigureLoom Bio tests
        run: |
          cd figureloom-bio
          python3 -m unittest discover -s tests -v