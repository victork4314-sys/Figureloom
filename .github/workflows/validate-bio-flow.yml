name: Validate FigureLoom Bio semantic flow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bio_flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check semantic browser JavaScript
        run: |
          node --check ide/ide-semantic-language.js
          node --check ide/ide-semantic-runtime.js
          node --check ide/ide-semantic-run-authority.js
          node --check ide/ide-language-highlighter.js
          node --check ide/ide-app-v2.js
          node --check scripts/validate-bio-semantic-runtime.mjs
          node --check scripts/validate-bio-all-in-one-table-section.mjs

      - name: Validate tokenizer grammar AST and direct dispatcher
        run: node scripts/validate-bio-semantic-runtime.mjs

      - name: Execute the semantic all-in-one table chain
        run: node scripts/validate-bio-all-in-one-table-section.mjs

      - name: Run exact all-in-one browser program regression
        run: node scripts/validate-bio-exact-all-in-one.mjs

      - name: Validate scientific browser handlers
        run: |
          node scripts/validate-bio-core-translation.mjs
          node scripts/validate-bio-analysis-language.mjs
          node scripts/validate-bio-current-file-runtime.mjs

      - name: Reject unfinished runtime placeholders
        run: node scripts/validate-bio-no-placeholders.mjs

      - name: Validate documentation
        run: node scripts/validate-bio-documentation.mjs

      - name: Run semantic Python tests
        env:
          PYTHONPATH: figureloom-bio
        run: |
          python3 -m unittest figureloom-bio/tests/test_semantic_language.py -v
          python3 -m unittest figureloom-bio/tests/test_control_flow_logic.py -v
          python3 -m unittest figureloom-bio/tests/test_sequence_management.py -v

      - name: Run complete FigureLoom Bio regressions
        run: |
          cd figureloom-bio
          python3 -m unittest discover -s tests -v
